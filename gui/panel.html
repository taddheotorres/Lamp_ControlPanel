<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crystalctl</title>
<style>
/* Terminal look: monospace everywhere, ASCII art, black and red. Red marks what is alive. */
:root {
  --bg: #050203; --panel: rgba(8, 3, 4, .82); --ink: #ece4e4; --muted: #8c7577; --faint: #4a3436;
  --rule: #2a1416; --rule-strong: #4a1c20; --red: #ff2a2a; --red-dim: #8b0a0f;
  --field: 255, 42, 42; --field-alpha: .34;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f1ece6; --panel: rgba(250, 247, 243, .86); --ink: #140607; --muted: #7a6062; --faint: #c3b3b0;
  --rule: #ddd1cc; --rule-strong: #c9b6b1; --red: #d10f1a; --red-dim: #e8a2a5;
  --field: 140, 10, 16; --field-alpha: .22;
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1ece6; --panel: rgba(250, 247, 243, .86); --ink: #140607; --muted: #7a6062; --faint: #c3b3b0;
    --rule: #ddd1cc; --rule-strong: #c9b6b1; --red: #d10f1a; --red-dim: #e8a2a5;
    --field: 140, 10, 16; --field-alpha: .22;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--bg); color: var(--ink); font: 13px/1.55 var(--mono); }
#field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 26px 22px 40px; }

pre.art { margin: 0; font: 700 9px/1 var(--mono); letter-spacing: 0; white-space: pre; }
.red { color: var(--red); }
.muted { color: var(--muted); }
.label { font-size: 11px; letter-spacing: .08em; text-transform: lowercase; color: var(--muted); }

header { display: grid; grid-template-columns: 1fr auto; gap: 14px 24px; align-items: end; }
.brand pre { color: var(--red); text-shadow: 0 0 12px rgba(255, 42, 42, .25); }
.prompt { margin-top: 12px; color: var(--muted); }
.prompt b { color: var(--ink); font-weight: 500; }
.cursor { display: inline-block; width: .6em; height: 1.1em; vertical-align: -2px; background: var(--red); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.counter { text-align: right; }
.counter pre { color: var(--faint); }
.counter pre .on { color: var(--red); }
.toolbar { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  padding: 10px 0; border-top: 1px dashed var(--rule-strong); border-bottom: 1px dashed var(--rule-strong); }
.spacer { flex: 1; }

/* buttons read as [ command ] */
button, a.btn {
  font: 500 12px/1 var(--mono); color: var(--ink); background: transparent; border: 0; padding: 7px 6px;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
button::before, a.btn::before { content: "[ "; color: var(--muted); }
button::after, a.btn::after { content: " ]"; color: var(--muted); }
button:hover, a.btn:hover { background: var(--ink); color: var(--bg); }
button:hover::before, button:hover::after, a.btn:hover::before, a.btn:hover::after { color: var(--bg); }
button.go { color: var(--red); }
button.go:hover { background: var(--red); color: #fff; }
button:focus-visible, a.btn:focus-visible, input:focus-visible { outline: 1px solid var(--red); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: not-allowed; background: transparent; color: var(--ink); }
button:disabled::before, button:disabled::after { color: var(--muted); }

section { margin-top: 28px; }
.head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 12px; color: var(--muted); }
.head b { color: var(--red); font-weight: 700; }
.head .ink { color: var(--ink); }
.head .rule { flex: 1; overflow: hidden; white-space: nowrap; color: var(--rule-strong); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px 14px; }
.card { position: relative; border: 1px solid var(--rule-strong); background: var(--panel); padding: 18px 14px 10px;
  backdrop-filter: blur(2px); }
.card.on { border-color: var(--red-dim); }
.card .title { position: absolute; top: -9px; left: 10px; padding: 0 6px; background: var(--bg); line-height: 16px; }
.card .title b { font-weight: 700; }
.card.on .title b { color: var(--red); }
.card .bar { position: absolute; top: -9px; right: 10px; padding: 0 6px; background: var(--bg); line-height: 16px; color: var(--faint); }
.card.on .bar { color: var(--red); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 4px 0 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv dd .dots { color: var(--faint); }
.on .state { color: var(--red); }
.actions { display: flex; flex-wrap: wrap; margin: 0 -6px; border-top: 1px dashed var(--rule); padding-top: 6px; }

.toggle { cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.toggle input { appearance: none; margin: 0; width: 0; height: 0; position: absolute; opacity: 0; }
.toggle .box::before { content: "[ ]"; color: var(--muted); }
.toggle input:checked + .box::before { content: "[x]"; color: var(--red); }
.toggle input:focus-visible + .box { outline: 1px solid var(--red); }

.list { border: 1px solid var(--rule-strong); background: var(--panel); }
.item { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 12px; align-items: center; padding: 4px 10px; }
.item + .item { border-top: 1px dashed var(--rule); }
.item .n { color: var(--faint); }
.item .via { color: var(--muted); font-size: 12px; }

.console { margin-top: 28px; border: 1px solid var(--rule-strong); background: rgba(3, 1, 1, .92); color: #d9cfcf; }
.console .bar { display: flex; align-items: center; padding: 2px 4px 2px 12px; border-bottom: 1px dashed #3a1a1d; color: #8c7577; }
.console button { color: #ece4e4; }
.console button:hover { background: #ece4e4; color: #050203; }
.console pre { margin: 0; padding: 12px; height: 200px; overflow: auto; font: 12px/1.6 var(--mono); white-space: pre-wrap; }
.console .t { color: #5a4446; }
.console .tag { color: #b07a7d; }
.console .err { color: #ff2a2a; }

dialog { border: 1px solid var(--rule-strong); padding: 0; width: min(860px, 92vw); background: var(--bg); color: var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, .65); }
.dlg { padding: 16px; display: grid; gap: 12px; }
.dlg pre { margin: 0; max-height: 58vh; overflow: auto; padding: 12px; background: #030101; color: #d9cfcf;
  border: 1px dashed #3a1a1d; font: 12px/1.55 var(--mono); white-space: pre-wrap; }
.dlg .row { display: flex; justify-content: flex-end; }
.empty { padding: 14px 0; color: var(--muted); }

@media (max-width: 640px) {
  header { grid-template-columns: 1fr; }
  .counter { text-align: left; }
  pre.art { font-size: 6px; }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="brand">
      <pre class="art" id="brand" aria-label="crystalctl"></pre>
      <div class="prompt">taddheo@localhost:~$ <b>crystalctl status</b> <span class="muted" id="pm"></span><span class="cursor" aria-hidden="true"></span></div>
    </div>
    <div class="counter">
      <pre class="art" id="count" aria-hidden="true"></pre>
      <div class="label" id="countLabel">services running</div>
    </div>
    <div class="toolbar">
      <button class="go" data-all="start">start all</button>
      <button data-all="restart">restart all</button>
      <button data-all="stop">stop all</button>
      <span class="spacer"></span>
      <span class="label" id="busy"></span>
      <button id="theme" aria-label="Switch light or dark theme">theme</button>
    </div>
  </header>

  <main id="sections"><div class="empty">connecting…</div></main>

  <section class="console" aria-label="Console">
    <div class="bar"><span>// console</span><span class="spacer"></span><button id="clear">clear</button></div>
    <pre id="out" aria-live="polite"></pre>
  </section>
</div>

<dialog id="dlg"><div class="dlg">
  <div class="red" id="dlgTitle"></div>
  <pre id="dlgBody"></pre>
  <div class="muted" id="dlgNote"></div>
  <div class="row"><button id="dlgCancel">close</button><button class="go" id="dlgOk" hidden>install</button></div>
</div></dialog>

<script>
// 5x7 glyphs, one 5-bit row per number
const FONT = {"A":[14,17,17,31,17,17,17],"B":[30,17,17,30,17,17,30],"C":[14,17,16,16,16,17,14],"D":[28,18,17,17,17,18,28],"E":[31,16,16,30,16,16,31],"F":[31,16,16,30,16,16,16],"G":[14,17,16,23,17,17,15],"H":[17,17,17,31,17,17,17],"I":[14,4,4,4,4,4,14],"J":[7,2,2,2,2,18,12],"K":[17,18,20,24,20,18,17],"L":[16,16,16,16,16,16,31],"M":[17,27,21,21,17,17,17],"N":[17,17,25,21,19,17,17],"O":[14,17,17,17,17,17,14],"P":[30,17,17,30,16,16,16],"Q":[14,17,17,17,21,18,13],"R":[30,17,17,30,20,18,17],"S":[15,16,16,14,1,1,30],"T":[31,4,4,4,4,4,4],"U":[17,17,17,17,17,17,14],"V":[17,17,17,17,17,10,4],"W":[17,17,17,21,21,21,10],"X":[17,17,10,4,10,17,17],"Y":[17,17,17,10,4,4,4],"Z":[31,1,2,4,8,16,31],"0":[14,17,19,21,25,17,14],"1":[4,12,4,4,4,4,14],"2":[14,17,1,2,4,8,31],"3":[31,2,4,2,1,17,14],"4":[2,6,10,18,31,2,2],"5":[31,16,30,1,1,17,14],"6":[6,8,16,30,17,17,14],"7":[31,1,2,4,8,8,8],"8":[14,17,17,14,17,17,14],"9":[14,17,17,15,1,2,12],"/":[0,1,2,4,8,16,0],"-":[0,0,0,31,0,0,0],".":[0,0,0,0,0,12,12],":":[0,12,12,0,12,12,0]," ":[0,0,0,0,0,0,0]};
const TOKEN = location.hash.slice(1);
history.replaceState(null, "", "/");  // keep the token out of the visible URL
const $ = (s) => document.querySelector(s);
const root = document.documentElement;
let state = { services: [], kinds: [], busy: false }, consoleAt = 0;

/* 5x7 block letters as text. `off` fills unlit cells, like an unpowered display. */
function banner(text, on = "█", off = " ") {
  const chars = String(text).toUpperCase().split("");
  return [0, 1, 2, 3, 4, 5, 6].map((y) => chars.map((ch) => {
    const bits = (FONT[ch] || FONT[" "])[y];
    let row = "";
    for (let x = 0; x < 5; x++) row += bits & (16 >> x) ? on : off;
    return row;
  }).join(off)).join("\n");
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-Crystal-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const pad2 = (n) => String(n).padStart(2, "0");

function row(k, v) {
  return `<dt>${k}</dt><dd>${v}</dd>`;
}

function card(s) {
  const on = s.active === "active";
  return `<article class="card ${on ? "on" : ""}">
    <span class="title">[ <b>${esc(s.name.toLowerCase())}</b> ]</span>
    <span class="bar" aria-hidden="true">[${on ? "■".repeat(8) : "·".repeat(8)}]</span>
    <dl class="kv">
      ${row("unit", `${esc(s.unit)}.service`)}
      ${row("state", `<span class="state">${on ? "running" : esc(s.active)}</span> <span class="dots">(${esc(s.sub || "-")})</span>`)}
      ${row("pid", s.pid ?? "-")}
      ${row("ports", s.ports?.length ? s.ports.join(", ") : "-")}
      ${row("boot", `<label class="toggle"><input type="checkbox" data-boot="${s.id}" ${s.enabled ? "checked" : ""}
        aria-label="Start ${esc(s.name)} at boot"><span class="box"></span>${s.enabled ? "enabled" : "disabled"}</label>`)}
    </dl>
    <div class="actions">
      ${on ? `<button data-id="${s.id}" data-act="stop">stop</button>` : `<button class="go" data-id="${s.id}" data-act="start">start</button>`}
      <button data-id="${s.id}" data-act="restart" ${on ? "" : "disabled"}>restart</button>
      <button data-logs="${s.id}">logs</button>
      ${s.config ? `<button data-open="${s.id}" data-what="config">config</button>` : ""}
      ${s.admin ? `<a class="btn" href="${esc(s.admin.url)}" target="_blank" rel="noopener">${esc(s.admin.label.toLowerCase())}</a>` : ""}
    </div>
  </article>`;
}

function item(s, i) {
  return `<div class="item">
    <span class="n">${pad2(i + 1)}</span>
    <span>${esc(s.name.toLowerCase())}</span>
    <span class="via">${s.installable ? "via " + esc(state.pm) : "not in your distro's repos"}</span>
    ${s.installable ? `<button data-install="${s.id}">install</button>` : "<span></span>"}
  </div>`;
}

function head(n, label) {
  return `<div class="head"><b>${pad2(n)}</b><span class="ink">${esc(label.toLowerCase())}</span><span class="rule">${"─".repeat(200)}</span></div>`;
}

function render() {
  const installed = state.services.filter((s) => s.installed);
  const running = installed.filter((s) => s.active === "active").length;
  // lit cells red when something runs, unlit cells drawn faint like a display
  $("#count").innerHTML = esc(banner(`${pad2(running)}/${pad2(installed.length)}`, "█", "░"))
    .replace(/█+/g, (m) => running ? `<span class="on">${m}</span>` : m);
  $("#pm").textContent = state.demo ? "# demo: sample data " : `# pkg: ${state.pm || "none"} `;
  $("#busy").textContent = state.busy ? "working…" : "";

  let html = "", n = 0;
  for (const [kind, label] of state.kinds) {
    const mine = installed.filter((s) => s.kind === kind);
    if (mine.length) html += `<section>${head(++n, label)}<div class="grid">${mine.map(card).join("")}</div></section>`;
  }
  if (!installed.length) html += `<section>${head(++n, "installed")}<div class="empty">nothing managed yet. install something below.</div></section>`;
  const rest = state.services.filter((s) => !s.installed);
  const panels = [{ id: "phpmyadmin", name: "phpMyAdmin", installable: !!state.pm }, { id: "adminer", name: "Adminer", installable: state.pm === "apt" }];
  html += `<section>${head(++n, "available")}<div class="list">${[...rest, ...panels].map(item).join("")}</div></section>`;
  $("#sections").innerHTML = html;
  // header buttons persist across renders; card buttons are rebuilt, so only ever disable those
  document.querySelectorAll("button[data-all]").forEach((b) => (b.disabled = state.busy));
  if (state.busy) document.querySelectorAll("#sections button[data-act], #sections button[data-install], #sections input[data-boot]").forEach((b) => (b.disabled = true));
}

async function refresh() {
  try {
    state = await api("/api/status");
    if (state.theme && !root.dataset.theme) root.dataset.theme = state.theme;
    render();
  } catch (e) { $("#busy").textContent = "offline // relaunch crystalctl-gui"; }
}

async function pollConsole() {
  try {
    const { next, lines } = await api(`/api/console?since=${consoleAt}`);
    consoleAt = next;
    if (lines.length) {
      const out = $("#out");
      out.insertAdjacentHTML("beforeend", lines.map((l) =>
        `<span class="t">${l.t}</span> <span class="${l.tag === "err" ? "err" : "tag"}">${esc(l.tag)}</span> ${esc(l.text)}\n`).join(""));
      out.scrollTop = out.scrollHeight;
      refresh();
    }
  } catch (_) {}
}

function show(title, body, note = "", onOk = null) {
  $("#dlgTitle").textContent = title;
  $("#dlgBody").textContent = body;
  $("#dlgNote").textContent = note;
  $("#dlgOk").hidden = !onOk;
  $("#dlgOk").onclick = () => { $("#dlg").close(); onOk(); };
  $("#dlg").showModal();
}

async function run(fn) {
  try { await fn(); } catch (e) { show("// can't do that", e.message); }
  refresh();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.act) run(() => api("/api/action", { id: b.dataset.id, action: b.dataset.act }));
  if (b.dataset.all) run(() => api("/api/action", { id: "all", action: b.dataset.all }));
  if (b.dataset.logs) run(async () => show(`// ${b.dataset.logs} journal`, (await api(`/api/logs?id=${b.dataset.logs}`)).text));
  if (b.dataset.open) run(() => api("/api/open", { id: b.dataset.open, what: b.dataset.what }));
  if (b.dataset.install) run(async () => {
    const { commands } = await api(`/api/install-plan?id=${b.dataset.install}`);
    show(`// install ${b.dataset.install}?`, commands.map((c) => "$ " + c.join(" ")).join("\n"),
      "runs as root through pkexec; your desktop will ask for your password.",
      () => run(() => api("/api/install", { id: b.dataset.install })));
  });
});
document.addEventListener("change", (e) => {
  const id = e.target.dataset?.boot;
  if (id) run(() => api("/api/action", { id, action: e.target.checked ? "enable" : "disable" }));
});
$("#dlgCancel").onclick = () => $("#dlg").close();
$("#clear").onclick = () => ($("#out").textContent = "");
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  api("/api/theme", { theme: root.dataset.theme }).catch(() => {});
};

/* Animated ASCII field behind everything: interfering waves mapped onto a density ramp.
   One fillText per row keeps it cheap; it idles while hidden and holds still for reduced motion. */
(function field() {
  const canvas = $("#field"), ctx = canvas.getContext("2d");
  const RAMP = " .,:;-=+*#%@";
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  let cols = 0, rows = 0, cw = 8, ch = 14, last = 0;
  function size() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `12px ${getComputedStyle(root).getPropertyValue("--mono")}`;
    cw = ctx.measureText("M").width; ch = 14;
    cols = Math.ceil(innerWidth / cw); rows = Math.ceil(innerHeight / ch);
  }
  function frame(now) {
    if (!document.hidden && now - last > 70) {
      last = now;
      const t = still.matches ? 0 : now / 1000;
      const css = getComputedStyle(root);
      const rgb = css.getPropertyValue("--field").trim(), alpha = parseFloat(css.getPropertyValue("--field-alpha"));
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.textBaseline = "top";
      for (let y = 0; y < rows; y++) {
        let line = "";
        for (let x = 0; x < cols; x++) {
          const v = Math.sin(x * 0.09 + t * 0.9) + Math.sin(y * 0.17 - t * 0.6)
                  + Math.sin((x * 0.05 + y * 0.11) + t * 0.45) + Math.sin(Math.hypot(x - cols * 0.7, y - rows * 0.3) * 0.12 - t);
          const i = Math.floor(((v + 4) / 8) ** 1.15 * RAMP.length);
          line += RAMP[Math.min(RAMP.length - 1, i)];
        }
        // fade toward the top so the header stays readable
        ctx.fillStyle = `rgba(${rgb}, ${alpha * (0.45 + 0.55 * y / rows)})`;
        ctx.fillText(line, 0, y * ch);
      }
    }
    if (!still.matches) requestAnimationFrame(frame);
  }
  size();
  addEventListener("resize", () => { size(); if (still.matches) frame(performance.now() + 1000); });
  still.addEventListener?.("change", () => requestAnimationFrame(frame));
  requestAnimationFrame(frame);
})();

$("#brand").textContent = banner("CRYSTALCTL");
refresh(); pollConsole();
setInterval(refresh, 4000);
setInterval(pollConsole, 1200);
setInterval(() => api("/api/ping", {}).catch(() => {}), 5000);
</script>
</body>
</html>

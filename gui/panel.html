<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crystalctl</title>
<style>
/* Monochrome, flat, thin rules and a dot grid; red is only ever a signal (running, errors, the brand dot). */
:root {
  --bg: #000; --surface: #0b0b0b; --raised: #141414; --ink: #f2f2f2; --muted: #8a8a8a; --faint: #3a3a3a;
  --rule: #1f1f1f; --rule-strong: #2e2e2e; --grid: rgba(255, 255, 255, .07); --red: #ff2a2a;
  --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #efefef; --surface: #fafafa; --raised: #fff; --ink: #0a0a0a; --muted: #6d6d6d; --faint: #c4c4c4;
  --rule: #dcdcdc; --rule-strong: #c9c9c9; --grid: rgba(0, 0, 0, .09); --red: #e0141e;
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #efefef; --surface: #fafafa; --raised: #fff; --ink: #0a0a0a; --muted: #6d6d6d; --faint: #c4c4c4;
    --rule: #dcdcdc; --rule-strong: #c9c9c9; --grid: rgba(0, 0, 0, .09); --red: #e0141e;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; background-color: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans);
  background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 18px 18px;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 24px 40px; }

/* dot-matrix text: SVG circles drawn from a 5x7 font, so it needs no font file */
.dots { display: inline-block; vertical-align: middle; color: var(--ink); }
.dots circle { fill: currentColor; }
.dots .off { opacity: .1; }
.red { color: var(--red); }

.mono { font-family: var(--mono); }
.label { font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

header { display: grid; grid-template-columns: 1fr auto; gap: 18px 24px; align-items: end;
  padding-bottom: 22px; border-bottom: 1px solid var(--rule-strong); }
.brand { display: flex; align-items: center; gap: 14px; }
.brand .pip { width: 12px; height: 12px; border-radius: 50%; background: var(--red); }
.sub { margin-top: 10px; display: flex; gap: 18px; flex-wrap: wrap; }
.counter { text-align: right; }
.counter .label { margin-top: 8px; }
.toolbar { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

button, a.btn {
  font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; text-decoration: none;
  color: var(--ink); background: transparent; border: 1px solid var(--rule-strong); border-radius: 999px;
  padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  transition: background .15s, color .15s, border-color .15s;
}
button:hover, a.btn:hover { border-color: var(--ink); }
button:focus-visible, a.btn:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: not-allowed; border-color: var(--rule-strong); }
button.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.solid:hover { background: transparent; color: var(--ink); }
button .led { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
button.stop .led { background: var(--red); }
button.round { width: 36px; height: 36px; padding: 0; justify-content: center; }
.half { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid currentColor;
  background: linear-gradient(90deg, currentColor 50%, transparent 50%); }

section { margin-top: 34px; }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.head .rule { flex: 1; height: 1px; background: var(--rule); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; padding: 18px; display: grid; gap: 16px; }
.card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card .name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.card .unit { margin-top: 4px; font: 11px var(--mono); color: var(--muted); }

/* status strip, read like the Glyph lights: lit red when running, dim when not */
.glyph { display: flex; gap: 4px; padding-top: 6px; }
.glyph i { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
.on .glyph i { background: var(--red); animation: sweep 2.4s infinite; }
.on .glyph i:nth-child(2) { animation-delay: .15s; } .on .glyph i:nth-child(3) { animation-delay: .3s; }
.on .glyph i:nth-child(4) { animation-delay: .45s; } .on .glyph i:nth-child(5) { animation-delay: .6s; }
.on .glyph i:nth-child(6) { animation-delay: .75s; } .on .glyph i:nth-child(7) { animation-delay: .9s; }
.on .glyph i:nth-child(8) { animation-delay: 1.05s; }
@keyframes sweep { 0%, 60%, 100% { opacity: 1; } 30% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .on .glyph i { animation: none; } }
.state { margin-top: 8px; text-align: right; }
.on .state { color: var(--red); }

.meta { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.meta div { padding: 10px 0 10px 12px; border-left: 1px solid var(--rule); min-width: 0; }
.meta div:first-child { border-left: 0; padding-left: 0; }
.meta dd { margin: 6px 0 0; font: 500 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }

.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font: 500 13px var(--mono); }
.switch input { appearance: none; margin: 0; width: 30px; height: 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--rule-strong); background: transparent; position: relative; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--muted); transition: transform .15s, background .15s; }
.switch input:checked { border-color: var(--ink); }
.switch input:checked::after { transform: translateX(14px); background: var(--red); }

.list { border-top: 1px solid var(--rule); }
.item { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 14px; align-items: center;
  padding: 12px 4px; border-bottom: 1px solid var(--rule); }
.item .n { font: 11px var(--mono); color: var(--faint); }
.item .name { font-weight: 500; }
.item .via { font: 11px var(--mono); color: var(--muted); }

.console { margin-top: 34px; border: 1px solid var(--rule); border-radius: 20px; overflow: hidden; background: #050505; }
.console .bar { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-bottom: 1px solid #1a1a1a; }
.console .bar .label { color: #8a8a8a; }
.console button { color: #f2f2f2; border-color: #2e2e2e; }
.console pre { margin: 0; padding: 14px 18px; height: 200px; overflow: auto; color: #d8d8d8;
  font: 12px/1.6 var(--mono); white-space: pre-wrap; }
.console .t { color: #555; }
.console .tag { color: #9a9a9a; }
.console .err { color: #ff2a2a; }

dialog { border: 1px solid var(--rule-strong); border-radius: 22px; padding: 0; width: min(860px, 92vw);
  background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
.dlg { padding: 20px; display: grid; gap: 14px; }
.dlg pre { margin: 0; max-height: 58vh; overflow: auto; padding: 14px; border-radius: 14px; background: #050505;
  color: #d8d8d8; font: 12px/1.55 var(--mono); white-space: pre-wrap; }
.dlg .note { font: 12px var(--mono); color: var(--muted); }
.dlg .row { display: flex; gap: 8px; justify-content: flex-end; }
.empty { padding: 22px 0; font: 12px var(--mono); color: var(--muted); }

@media (max-width: 640px) {
  header { grid-template-columns: 1fr; }
  .counter { text-align: left; }
  .meta { grid-template-columns: repeat(2, 1fr); }
  .meta div:nth-child(3) { border-left: 0; padding-left: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand"><span class="pip" aria-hidden="true"></span><span id="brand"></span></div>
      <div class="sub label"><span>Web</span><span>SQL</span><span>NoSQL</span><span id="pm">pkg —</span></div>
    </div>
    <div class="counter">
      <span id="count" aria-hidden="true"></span>
      <div class="label" id="countLabel">running</div>
    </div>
    <div class="toolbar">
      <button class="solid" data-all="start"><span class="led"></span>Start all</button>
      <button data-all="restart">Restart all</button>
      <button class="stop" data-all="stop"><span class="led"></span>Stop all</button>
      <span class="spacer"></span>
      <span class="label" id="busy"></span>
      <button class="round" id="theme" title="Light / dark" aria-label="Switch light or dark theme"><span class="half"></span></button>
    </div>
  </header>

  <main id="sections"><div class="empty">connecting…</div></main>

  <section class="console" aria-label="Console">
    <div class="bar"><span class="label">Console</span><span class="spacer"></span><button id="clear">Clear</button></div>
    <pre id="out" aria-live="polite"></pre>
  </section>
</div>

<dialog id="dlg"><div class="dlg">
  <div class="label" id="dlgTitle"></div>
  <pre id="dlgBody"></pre>
  <div class="note" id="dlgNote"></div>
  <div class="row"><button id="dlgCancel">Close</button><button class="solid" id="dlgOk" hidden>Install</button></div>
</div></dialog>

<script>
// 5x7 dot-matrix glyphs, one 5-bit row per number
const FONT = {"A":[14,17,17,31,17,17,17],"B":[30,17,17,30,17,17,30],"C":[14,17,16,16,16,17,14],"D":[28,18,17,17,17,18,28],"E":[31,16,16,30,16,16,31],"F":[31,16,16,30,16,16,16],"G":[14,17,16,23,17,17,15],"H":[17,17,17,31,17,17,17],"I":[14,4,4,4,4,4,14],"J":[7,2,2,2,2,18,12],"K":[17,18,20,24,20,18,17],"L":[16,16,16,16,16,16,31],"M":[17,27,21,21,17,17,17],"N":[17,17,25,21,19,17,17],"O":[14,17,17,17,17,17,14],"P":[30,17,17,30,16,16,16],"Q":[14,17,17,17,21,18,13],"R":[30,17,17,30,20,18,17],"S":[15,16,16,14,1,1,30],"T":[31,4,4,4,4,4,4],"U":[17,17,17,17,17,17,14],"V":[17,17,17,17,17,10,4],"W":[17,17,17,21,21,21,10],"X":[17,17,10,4,10,17,17],"Y":[17,17,17,10,4,4,4],"Z":[31,1,2,4,8,16,31],"0":[14,17,19,21,25,17,14],"1":[4,12,4,4,4,4,14],"2":[14,17,1,2,4,8,31],"3":[31,2,4,2,1,17,14],"4":[2,6,10,18,31,2,2],"5":[31,16,30,1,1,17,14],"6":[6,8,16,30,17,17,14],"7":[31,1,2,4,8,8,8],"8":[14,17,17,14,17,17,14],"9":[14,17,17,15,1,2,12],"/":[0,1,2,4,8,16,0],"-":[0,0,0,31,0,0,0],".":[0,0,0,0,0,12,12],":":[0,12,12,0,12,12,0]," ":[0,0,0,0,0,0,0]};
const TOKEN = location.hash.slice(1);
history.replaceState(null, "", "/");  // keep the token out of the visible URL
const $ = (s) => document.querySelector(s);
const root = document.documentElement;
let state = { services: [], kinds: [], busy: false }, consoleAt = 0;

/* Render text as a 5x7 LED matrix. `off` also draws the unlit dots, like a display panel. */
function dots(text, size = 4, off = false) {
  const chars = String(text).toUpperCase().split("");
  const pitch = size, cols = chars.length * 6 - 1;
  let out = "";
  chars.forEach((ch, i) => {
    const rows = FONT[ch] || FONT[" "];
    rows.forEach((bits, y) => {
      for (let x = 0; x < 5; x++) {
        const lit = bits & (16 >> x);
        if (lit || off) out += `<circle class="${lit ? "" : "off"}" cx="${(i * 6 + x) * pitch + pitch / 2}" cy="${y * pitch + pitch / 2}" r="${pitch * 0.32}"/>`;
      }
    });
  });
  return `<svg class="dots" width="${cols * pitch}" height="${7 * pitch}" viewBox="0 0 ${cols * pitch} ${7 * pitch}" aria-label="${esc(text)}" role="img">${out}</svg>`;
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-Crystal-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const pad2 = (n) => String(n).padStart(2, "0");

function card(s) {
  const on = s.active === "active";
  return `<article class="card ${on ? "on" : ""}">
    <div class="top">
      <div><div class="name">${esc(s.name)}</div><div class="unit">${esc(s.unit)}.service</div></div>
      <div><div class="glyph" aria-hidden="true">${"<i></i>".repeat(8)}</div><div class="label state">${on ? "running" : esc(s.active)}</div></div>
    </div>
    <dl class="meta">
      <div><dt class="label">PID</dt><dd>${s.pid ?? "—"}</dd></div>
      <div><dt class="label">Ports</dt><dd>${s.ports?.length ? s.ports.join(" ") : "—"}</dd></div>
      <div><dt class="label">State</dt><dd>${esc(s.sub || "—")}</dd></div>
      <div><dt class="label">Boot</dt><dd><label class="switch"><input type="checkbox" data-boot="${s.id}" ${s.enabled ? "checked" : ""}
        aria-label="Start ${esc(s.name)} at boot">${s.enabled ? "on" : "off"}</label></dd></div>
    </dl>
    <div class="actions">
      ${on ? `<button class="stop" data-id="${s.id}" data-act="stop"><span class="led"></span>Stop</button>`
           : `<button class="solid" data-id="${s.id}" data-act="start"><span class="led"></span>Start</button>`}
      <button data-id="${s.id}" data-act="restart" ${on ? "" : "disabled"}>Restart</button>
      <button data-logs="${s.id}">Logs</button>
      ${s.config ? `<button data-open="${s.id}" data-what="config">Config</button>` : ""}
      ${s.admin ? `<a class="btn" href="${esc(s.admin.url)}" target="_blank" rel="noopener">${esc(s.admin.label)} ↗</a>` : ""}
    </div>
  </article>`;
}

function item(s, i) {
  return `<div class="item">
    <span class="n">${pad2(i + 1)}</span>
    <span class="name">${esc(s.name)}</span>
    <span class="via">${s.installable ? "via " + esc(state.pm) : "not in your distro's repos"}</span>
    ${s.installable ? `<button data-install="${s.id}">Install</button>` : "<span></span>"}
  </div>`;
}

function head(n, label) {
  return `<div class="head">${dots(pad2(n), 3)}<span class="label">${esc(label)}</span><span class="rule"></span></div>`;
}

function render() {
  const installed = state.services.filter((s) => s.installed);
  const running = installed.filter((s) => s.active === "active").length;
  $("#count").innerHTML = dots(`${pad2(running)}/${pad2(installed.length)}`, 6, true);
  $("#count").firstChild.classList.toggle("red", running > 0);
  $("#pm").textContent = `pkg ${state.pm || "none"}`;
  $("#busy").textContent = state.busy ? "working…" : "";

  let html = "", n = 0;
  for (const [kind, label] of state.kinds) {
    const mine = installed.filter((s) => s.kind === kind);
    if (mine.length) html += `<section>${head(++n, label)}<div class="grid">${mine.map(card).join("")}</div></section>`;
  }
  if (!installed.length) html += `<section>${head(++n, "Installed")}<div class="empty">Nothing managed yet. Install something below.</div></section>`;
  const rest = state.services.filter((s) => !s.installed);
  const panels = [{ id: "phpmyadmin", name: "phpMyAdmin", installable: !!state.pm }, { id: "adminer", name: "Adminer", installable: state.pm === "apt" }];
  html += `<section>${head(++n, "Available")}<div class="list">${[...rest, ...panels].map(item).join("")}</div></section>`;
  $("#sections").innerHTML = html;
  // header buttons persist across renders; card buttons are rebuilt, so only ever disable those
  document.querySelectorAll("button[data-all]").forEach((b) => (b.disabled = state.busy));
  if (state.busy) document.querySelectorAll("#sections button[data-act], #sections button[data-install], #sections input[data-boot]").forEach((b) => (b.disabled = true));
}

async function refresh() {
  try {
    state = await api("/api/status");
    if (state.theme && !root.dataset.theme) root.dataset.theme = state.theme;
    render();
  } catch (e) { $("#busy").textContent = "offline — relaunch crystalctl-gui"; }
}

async function pollConsole() {
  try {
    const { next, lines } = await api(`/api/console?since=${consoleAt}`);
    consoleAt = next;
    if (lines.length) {
      const out = $("#out");
      out.insertAdjacentHTML("beforeend", lines.map((l) =>
        `<span class="t">${l.t}</span> <span class="${l.tag === "err" ? "err" : "tag"}">${esc(l.tag)}</span>  ${esc(l.text)}\n`).join(""));
      out.scrollTop = out.scrollHeight;
      refresh();
    }
  } catch (_) {}
}

function show(title, body, note = "", onOk = null) {
  $("#dlgTitle").textContent = title;
  $("#dlgBody").textContent = body;
  $("#dlgNote").textContent = note;
  $("#dlgOk").hidden = !onOk;
  $("#dlgOk").onclick = () => { $("#dlg").close(); onOk(); };
  $("#dlg").showModal();
}

async function run(fn) {
  try { await fn(); } catch (e) { show("Can't do that", e.message); }
  refresh();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.act) run(() => api("/api/action", { id: b.dataset.id, action: b.dataset.act }));
  if (b.dataset.all) run(() => api("/api/action", { id: "all", action: b.dataset.all }));
  if (b.dataset.logs) run(async () => show(`${b.dataset.logs} · journal`, (await api(`/api/logs?id=${b.dataset.logs}`)).text));
  if (b.dataset.open) run(() => api("/api/open", { id: b.dataset.open, what: b.dataset.what }));
  if (b.dataset.install) run(async () => {
    const { commands } = await api(`/api/install-plan?id=${b.dataset.install}`);
    show(`Install ${b.dataset.install}?`, commands.map((c) => "$ " + c.join(" ")).join("\n"),
      "Runs as root through pkexec; your desktop will ask for your password.",
      () => run(() => api("/api/install", { id: b.dataset.install })));
  });
});
document.addEventListener("change", (e) => {
  const id = e.target.dataset?.boot;
  if (id) run(() => api("/api/action", { id, action: e.target.checked ? "enable" : "disable" }));
});
$("#dlgCancel").onclick = () => $("#dlg").close();
$("#clear").onclick = () => ($("#out").textContent = "");
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  api("/api/theme", { theme: root.dataset.theme }).catch(() => {});
};

$("#brand").innerHTML = dots("CRYSTAL/CTL", 5);
refresh(); pollConsole();
setInterval(refresh, 4000);
setInterval(pollConsole, 1200);
setInterval(() => api("/api/ping", {}).catch(() => {}), 5000);
</script>
</body>
</html>

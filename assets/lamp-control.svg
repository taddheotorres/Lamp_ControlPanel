<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0d" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00aa44" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#003314" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Terminal / Server Rack Layer 1 (Top) -->
  <rect x="22" y="24" width="84" height="20" rx="6" fill="#111813" stroke="#00ff66" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="34" cy="34" r="3" fill="#00ff66" filter="url(#glow)" />
  <circle cx="44" cy="34" r="3" fill="#00ff66" opacity="0.6" />
  <line x1="56" y1="34" x2="94" y2="34" stroke="#00ff66" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />

  <!-- Terminal / Server Rack Layer 2 (Middle) -->
  <rect x="22" y="50" width="84" height="20" rx="6" fill="#111813" stroke="#00ff66" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="34" cy="60" r="3" fill="#00ff66" filter="url(#glow)" />
  <circle cx="44" cy="60" r="3" fill="#00ff66" opacity="0.6" />
  <line x1="56" y1="60" x2="82" y2="60" stroke="#00ff66" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />

  <!-- Terminal / Server Rack Layer 3 (Bottom) -->
  <rect x="22" y="76" width="84" height="20" rx="6" fill="#111813" stroke="#00ff66" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="34" cy="86" r="3" fill="#00ff66" filter="url(#glow)" />
  <circle cx="44" cy="86" r="3" fill="#00ff66" opacity="0.6" />
  <line x1="56" y1="86" x2="90" y2="86" stroke="#00ff66" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />

  <!-- Prompt Cursor / LAMP Symbol -->
  <path d="M 46 108 L 56 108" stroke="#00ff66" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 32 104 L 38 108 L 32 112" fill="none" stroke="#00ff66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="64" y="112" font-family="monospace" font-size="10" font-weight="bold" fill="#00ff66" opacity="0.9">LAMP</text>
</svg>
